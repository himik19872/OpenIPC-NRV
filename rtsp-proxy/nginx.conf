# RTSP-прокси для внешних систем.
#
# Зачем отдельный nginx: MediaMTX 1.20.1 поддерживает только один
# RTSP-порт, а авторизация в нём задаётся глобально для всех подключений.
# Требовать пароль на основном порту нельзя — его не передают внутренние
# потребители (бэкенд, детектор, браузер через HLS-прокси).
#
# Поэтому внешний доступ вынесен на отдельный порт 9784: этот nginx
# слушает его и передаёт трафик на RTSP-порт MediaMTX. Так внешние системы
# получают предсказуемый адрес из документации, а внутренние работают
# как прежде.
#
# Именно stream (а не http): RTSP — это отдельный протокол, nginx передаёт
# его потоком байт, не разбирая содержимое. Проверка учётных данных
# происходит в MediaMTX.

events {
    worker_connections 1024;
}

stream {
    # rtmp-подобная буферизация не нужна: поток передаётся как есть,
    # задержка не растёт.
    proxy_connect_timeout 10s;
    proxy_timeout 1h;
    proxy_buffer_size 16k;

    server {
        listen 9784;
        # Адрес задаётся как host:port, без схемы: nginx передаёт поток
        # байт и не разбирает протокол, поэтому rtsp:// здесь не нужен.
        proxy_pass mediamtx:8554;
    }
}
