server {
    listen 80;
    server_name localhost;
    root /usr/share/nginx/html;
    index index.html;

    # SPA routing
    location / {
        try_files $uri $uri/ /index.html;
    }

    # API proxy
    location /api/ {
        proxy_pass http://host.docker.internal:8080;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    }

    # Прокси MinIO: ссылки на видео и снимки идут через тот же хост, что и интерфейс,
    # поэтому архив работает при открытии извне (не требует внешнего адреса MinIO).
    # Presigned-ссылки подписаны на конкретный Host, поэтому Host пробрасываем как есть.
    location /minio/ {
        proxy_pass http://host.docker.internal:9000/;
        proxy_http_version 1.1;
        proxy_set_header Host $http_host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;

        # Плеер запрашивает видео частями (Range) и перематывает — нужен буферизованный
        # ответ с корректными заголовками, иначе Chrome не начинает воспроизведение.
        # Буферы увеличены: клипы бывают по 20+ МБ, и при нехватке nginx сбрасывает
        # ответ на диск (в логе «response is buffered to a temporary file»).
        proxy_buffering on;
        proxy_buffer_size 128k;
        proxy_buffers 32 128k;
        proxy_busy_buffers_size 256k;
        proxy_max_temp_file_size 0;
        proxy_read_timeout 300s;
        proxy_connect_timeout 30s;
        client_max_body_size 0;
    }
}